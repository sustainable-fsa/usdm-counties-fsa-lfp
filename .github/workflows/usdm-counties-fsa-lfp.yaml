# Canonical archive-update workflow (sustainable-fsa S3 migration).
name: update
run-name: Update the usdm-counties-fsa-lfp archive → S3

on:
  schedule:
    # fallback only; normally dispatched from sustainable-fsa/usdm
    - cron: '20 20 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Run even when the freshness precheck sees nothing new upstream.
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['**.R', '.github/workflows/**']

permissions:
  id-token: write
  contents: write  # commit-back of rendered README

concurrency:
  group: s3-archive-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  # Decide whether there is anything to do before the macOS runner and the
  # geospatial toolchain spin up. Pure HTTP probes against the published
  # archives — no checkout, no credentials, no S3 pull. The per-week gates in
  # the R script remain the local authority once `update` starts; this only
  # decides whether to start at all.
  #
  # The gate fails OPEN: it skips only on a definite answer (a 404 upstream, or
  # the week already present here). A probe that itself fails leaves `proceed`
  # true, so a network blip costs a redundant run rather than silently stalling
  # the archive.
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - id: gate
        env:
          UPSTREAM: https://data.sustainable-fsa.com/usdm/data/parquet
          MINE: https://data.sustainable-fsa.com/usdm-counties-fsa-lfp/data/usdm
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail

          # Code changes and an explicit force always run; only the scheduled
          # and dispatched cascade paths are gated.
          if [ "$EVENT" = push ] || [ "$FORCE" = true ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Newest USDM Tuesday at least two days old — mirrors usdm_get_dates().
          wk=
          for i in $(seq 2 15); do
            d=$(date -u -d "$i days ago" +%F)
            if [ "$(date -u -d "$d" +%u)" = 2 ]; then wk="$d"; break; fi
          done

          # `--retry` writes %{http_code} once per attempt, so keep the last one.
          # An empty result (curl could not run) matches nothing below and so
          # falls through to proceed=true.
          probe() {
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 \
              -I "$1" 2>/dev/null | tail -c 3
          }

          up=$(probe "$UPSTREAM/USDM_$wk.parquet")
          mine=$(probe "$MINE/USDM_$wk.parquet")
          echo "week=$wk upstream=$up mine=$mine"

          # A skip on a dispatched run is worth flagging: whatever dispatched us
          # should already have published the week.
          lvl=notice
          if [ "$EVENT" = workflow_dispatch ]; then lvl=warning; fi

          if [ "$up" = 404 ]; then
            echo "::${lvl}::Upstream usdm parquet for $wk is not published yet; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$up" = 200 ] && [ "$mine" = 200 ]; then
            echo "::notice::$wk is already present in this archive; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: precheck
    # `always()` so a precheck that errors outright does not skip the archive:
    # only an explicit `false` gates the run. The precheck is an optimisation,
    # never a dependency.
    if: always() && needs.precheck.outputs.proceed != 'false'
    runs-on: macos-latest
    timeout-minutes: 350
    env:
      S3_BUCKET: sustainable-fsa
      S3_PREFIX: usdm-counties-fsa-lfp
      AWS_REGION: us-west-2
      CLOUDFRONT_DISTRIBUTION_ID: E1BNL6ONVN84RI
      CLOUDFRONT_BASE: https://data.sustainable-fsa.com
    steps:
      - uses: mt-climate-office/actions/setup-geospatial@v1

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::202533506375:role/sustainable-fsa-github-actions
          aws-region: us-west-2
          role-duration-seconds: 14400

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Update archive
        run: Rscript usdm-counties-fsa-lfp.R

      # Commit the freshly rendered README (and only it) back to git.
      # README.md text changes only when the data change, so no-op runs
      # skip the commit; PNG byte-noise alone never triggers one.
      - name: Commit refreshed README
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged; skipping commit."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md example-1.png
          git commit -m 'Weekly README render'
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "::notice::README render superseded by a concurrent run; skipping commit."
            exit 0
          fi
          git push
